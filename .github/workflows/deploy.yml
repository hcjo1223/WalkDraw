name: Deploy WalkDraw (GitHub Pages + OCI)

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # 저장소 Settings > Secrets and variables > Actions > Variables 에 GOOGLE_CLIENT_ID 등록
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # OCI 서버 자동 배포 — 테스트·빌드(build)가 통과해야 실행.
  # 서버 준비: server/setup-autodeploy.sh (한 번) → 출력된 값을 Secrets/Variables 에 등록.
  # OCI_HOST 변수가 없으면 이 잡은 건너뛴다.
  deploy-oci:
    name: Deploy to OCI server
    needs: build
    if: ${{ vars.OCI_HOST != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: oci
      url: https://walkdraw.129.203.174.119.sslip.io/
    steps:
      - name: Run deploy-oci.sh over SSH
        env:
          SSH_KEY: ${{ secrets.OCI_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.OCI_KNOWN_HOSTS }}
          OCI_HOST: ${{ vars.OCI_HOST }}
          OCI_USER: ${{ vars.OCI_USER || 'walkdraw-deploy' }}
        run: |
          set -euo pipefail
          [ -n "$SSH_KEY" ] || { echo "::error::Secrets OCI_SSH_KEY 가 없어요"; exit 1; }
          [ -n "$KNOWN_HOSTS" ] || { echo "::error::Variables OCI_KNOWN_HOSTS 가 없어요"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # 서버 쪽 키는 deploy-oci.sh 실행만 허용(command=)되어 있어 원격 명령은 보내지 않는다
          ssh -T -i ~/.ssh/deploy_key \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 -o ConnectTimeout=20 \
            "$OCI_USER@$OCI_HOST"
